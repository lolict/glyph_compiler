# ═══════════════════════════════════════
# 容量声明 — 由你定，程序只读取不自创
# ═══════════════════════════════════════
[容量声明]
声母基数 = 48           # 48声母
韵母基数 = 66           # 66韵母
声调进制 = 70           # 70声调（你定的）
系 = 6                  # 六系
每系列列数 = 7          # 每系七列
住客上限 = 256          # 住客表缓冲上限（非住客进制）
公约上限 = 32           # 公约条目缓冲上限

